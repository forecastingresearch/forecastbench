[project]
name = "forecastbench"
# The version is unused: this repository is not packaged (see `[tool.uv] package = false`).
version = "0.0.0"
requires-python = ">=3.14"
# Nothing is shared by every job; each Cloud Run job declares its own dependency group below.
dependencies = []

# Dependency groups (PEP 735). `dev` is the lint/test toolchain, `runtime` is the shared `fri-utils`
# package pinned in `[tool.uv.sources]`, and every other group is one Cloud Run job, named after its
# directory under `src/` (`nightly-` prefixed for `src/nightly_update_workflow/`). A job group lists only
# what that job imports, directly or as a hard transitive import, plus the `runtime` group.
[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    { include-group = "runtime" },
]
runtime = ["fri-utils"]
naive-and-dummy-forecasters = [
    "google-cloud-storage",
    "google-cloud-secret-manager",
    "gcsfs==2025.7.0",
    "backoff",
    "pandas>=2.2.2,<3.0",
    "pandas-market-calendars",
    "tqdm",
    "prophet==1.3.0",
    "cmdstanpy",
    "scipy",
    "termcolor",
    "pandera",
    "slack_sdk",
    { include-group = "runtime" },
]
