[tool.uv]
# Oldest uv verified to read this lockfile.
required-version = ">=0.11"
# The repository is run from `src/`, never built or installed.
package = false
# `uv sync` and `uv run` install every group, so one environment serves lint, tests and all jobs.
default-groups = "all"

[tool.uv.sources]
# Bump `rev` to update the shared utilities, then run `uv lock` and redeploy.
fri-utils = { git = "https://github.com/forecastingresearch/utils", rev = "843ae21dc8d5a4a75402ef6b3e46168ef88747e2" }

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = [".", "src"]
extend-exclude = [
    ".venv*",
    "experiments/stability-analysis",
    "experiments/ranking-simulation",
    "upload*",
]

[tool.ruff.lint]
# Parity with the previous isort + flake8 (+ bugbear B950) + pydocstyle setup.
select = ["E", "W", "F", "B", "I", "D"]
# E203/E701 are formatter-owned; B9xx is bugbear's opt-in set (B950 is emulated by E501 below).
ignore = ["E203", "E701", "B9"]

[tool.ruff.lint.pycodestyle]
# E501 at 110 reproduces bugbear's B950 (line-length + 10 %).
max-line-length = 110

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.ruff.format]
exclude = ["*.md"]
